<html>
    <head>
        <meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=0">
        <script type="text/javascript" src="https://phi-xi.github.io/src/js/utils.js?1twnui"></script>
        <link rel="stylesheet" href="https://fonts.googleapis.com/css?family=Ubuntu">
        <link rel="stylesheet" href="https://phi-xi.github.io/src/css/style.css?48357">
        <title>&Phi;&Xi; | PIMF Factory</title>
        <style>
            p {
                text-align: left;
                margin: 1em;
            }
            #textarea {
                font-family: monospace;
                font-size: 10pt;
                width: 40em;
                height: 10em;
                display: block;
                margin-bottom: 1em;
            }
            #url {
                width: 20em;
            }
            .topbar {
                font-size: 1.5rem;
            }
        </style>
    </head>
    <body>
        <div class="page-wrap has-topbar">
            <div class="topbar">
                &Phi;&Xi; | 
                <span class="orange-lite">
                    PIMF Factory
                </span>
            </div>
            <h3>Build config</h3>
            <p>
                <label>Hook URL</label>
                <input id="url">
                <label>Show GUI</label>
                <input id="gui" type="checkbox" checked>
            </p>
            <br>
            <h3>Output</h3>
            <p>
                <textarea id="textarea"></textarea>
                <button class="btn-green">Copy</button>
                <button class="btn-green">Download as bookmark</button>
            </p>
        </div>
    </body>
    <script>

        const
            url         = {
                            bkmrk: "/src/js/pimf/q-bookmark.html",
                            css: "/src/js/pimf/q.css",
                            js:  "/src/js/pimf/q.js" },
            btn         = U.r( "btn" ),
            textarea    = U.r( "textarea" ),
            input_hook  = U.r( "url" ),
            input_gui   = U.r( "gui" );

        function minify_css( src ){
            return U.dev.minify.css( src );
        }
        function minify_js( src ){
            return U.dev.minify.js( src );
        }
        function insert_css( js, css ){
            return js.replace(
                        /(const\scss\s*\=\s*\"\"\;)/g,
                        "const css = \"" + css + "\";" );
        }
        function insert_cfg( js ){
            let gui = input_gui.checked,
                url = input_hook.value.replace( /\/+$/g, "" );
            return js.replace(
                        /(gui\:null)/g,
                        "gui:" + gui.toString() )
                    .replace(
                        /(hook\:null)/g,
                        "hook:\"" + url + "/rc.js\"" )
                    .replace(
                        /(ping\:null)/g,
                        "ping:\"" + url + "/ping.js\"" );
        }
        function copy(){
            navigator.clipboard.writeText( textarea.value )
                .then( ()=>{
                    U.ui.dialog.toast( "Copied to clipboard" );
                } );
        }
        function download(){
            U.request( url.bkmrk, "GET", {} )
                .then( (r)=>{
                    let src = textarea.value.replace( /\"/g, "&quot;" ),
                        htm = r.replace( /HREF\=\"\"/g, "HREF=\"javascript:"
                                + src
                                + "\"" ),
                        url = "data:text/html;base64," + btoa( htm ),
                        ver = src.split( ",version=&quot;" )[1].slice(0,4),
                        a   = U.mk( "a", "" );
                    a.setAttribute( "href", url );
                    a.setAttribute( "download", "pimf-"
                        + ver
                        + ".html" );
                    a.click();
                } );
        }

        btn[0].addEventListener( "click", copy );
        btn[1].addEventListener( "click", download );

        input_hook.value = "https://phi-xi.github.io/src/js/pimf/";

        U.request( url.css, "GET", {} )
            .then( (r)=>{
                const css = minify_css( r );
                U.request( url.js, "GET", {} )
                    .then( (js)=>{
                        let src = insert_css(
                                    insert_cfg( js ),
                                    css );
                        textarea.value = minify_js( src );
                    } );
            } );

    </script>
</html>
