<html>
    <head>
        <meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=0">
        <link rel="icon" type="image/x-icon" href="/icon/phixi.svg">
        <script type="text/javascript" src="https://phi-xi.github.io/src/js/utils.js?1001"></script>
        <link rel="stylesheet" href="https://fonts.googleapis.com/css?family=Ubuntu">
        <link rel="stylesheet" href="https://phi-xi.github.io/src/css/style.css?1012">
        <title>&Phi;&Xi; | PIMF Factory</title>
        <style>
            p {
                text-align: left;
                margin: 1em;
            }
            #callback-inject,
            #callback-hook,
            #output {
                font-family: monospace;
                font-size: 10pt;
                width: 30rem;
                height: 10em;
                display: block;
                margin-bottom: 1em;
            }
            #output {
                font-size: 8pt;
                height: 24em;
                word-break: break-all;
            }
            #url {
                width: 20em;
            }
            .topbar {
                font-size: 1.5rem;
            }
            .inline {
                vertical-align: top;
            }
        </style>
    </head>
    <body>
        <div class="page-wrap has-topbar">
            <div class="topbar">
                &Phi;&Xi; | 
                <span class="orange-lite">
                    PIMF Factory
                </span>
            </div>
            <div class="inline">
                <h3>Build config</h3>
                <p>
                    <label>Hook URL</label>
                    <input id="url">
                    <label>On inject</label>
                    <textarea id="callback-inject"></textarea>
                    <label>On hook</label>
                    <textarea id="callback-hook"></textarea>
                    <label>Files</label>
                    <input type="file" id="file-select">
                </p>
            </div>
            <div class="inline">
                <h3>Output</h3>
                <p>
                    <textarea id="output"></textarea>
                    <button class="btn-green">Copy</button>
                </p>
            </div>
        </div>
    </body>
    <script>

        const
            url            = {
                                bkmrk: "/src/js/pimf/q-bookmark.html",
                                css: "/src/js/pimf/q.css",
                                js:  "/src/js/pimf/q.js" },
            btn            = U.r( "btn-green" ),
            textarea       = U.r( "output" ),
            input_hook     = U.r( "url" ),
            input_cb_inject = U.r( "callback-inject" ),
            input_cb_hook  = U.r( "callback-hook" ),
            file_select    = U.r( "file-select" );

        let files = [];

        function minify_css( src ){
            return U.dev.minify.css( src );
        }
        function minify_js( src ){
            return U.dev.minify.js( src );
        }
        function insert_css( js, css ){
            return js.replace(
                        /(const\scss\s*\=\s*\"\"\;)/g,
                        "const css = \"" + css + "\";" );
        }
        function insert_cfg( js ){
            let url = input_hook.value.replace( /\/+$/g, "" ),
                src_cb_inject = input_cb_inject.value,
                src_cb_hook   = input_cb_hook.value;
            return js.replace(
                        /(hook\:null)/g,
                        "hook:\"" + url + "/rc.js\"" )
                    .replace(
                        /(ping\:null)/g,
                        "ping:\"" + url + "/ping.js\"" )
                    .replace(
                        /(on\_inject\:function\(\)\{\})/g,
                        "on_inject:function(){" + src_cb_inject + "}" )
                    .replace(
                        /(on\_hook\:function\(\)\{\})/g,
                        "on_hook:function(){" + src_cb_hook + "}" )
                    .replace(
                        /(files\:\[\])/g,
                        "files:[\"" + files.join( "\",\"" ) + "\"]" );
        }
        function copy(){
            navigator.clipboard.writeText( textarea.value )
                .then( ()=>{
                    U.ui.dialog.toast( "Copied to clipboard" );
                } );
        }
        function download(){
            U.request( url.bkmrk, "GET", {} )
                .then( (r)=>{
                    let src = textarea.value,
                        htm = r.replace( /HREF\=\"\"/g, "HREF=\"javascript:"
                                + src
                                + "\"" ),
                        url = "data:text/html;base64," + btoa( htm ),
                        ver = src.split( ",version=\"" )[1].slice(0,4),
                        a   = U.mk( "a", "" );
                    a.setAttribute( "href", url );
                    a.setAttribute( "download", "pimf-"
                        + ver
                        + ".html" );
                    a.click();
                } );
        }
        function update(){
            U.request( url.css, "GET", {} )
                .then( (r)=>{
                    const css = minify_css( r );
                    U.request( url.js, "GET", {} )
                        .then( (js)=>{
                            let src = insert_css(
                                        insert_cfg( js ),
                                        css );
                            textarea.value = minify_js( src );
                        } );
                } );
        }

        btn[0].addEventListener(          "click", copy );
        input_hook.addEventListener(      "change", update );
        input_cb_inject.addEventListener( "change", update );
        file_select.addEventListener(     "change", ()=>{
            let r = new FileReader();
            r.onload = ()=>{
                let url = r.result;
                files.push( url );
                update();
            };
            r.readAsDataURL( file_select.files[0] );
        } );
        
        input_hook.value      = "https://phi-xi.github.io/src/js/pimf/";
        input_cb_inject.value = "Q.gui.show();";

        update();

        btn[0].focus();

    </script>
</html>
