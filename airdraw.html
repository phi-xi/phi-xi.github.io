<html>
    <head>
        <title>AirDraw</title>
        <style>
            body{
                padding: 0;
                margin: 0;
                background-color: #000;
            }
            #ad-canvas,
            #ad-camera{
                display: none;
            }
            #ad-screen-wrap{
                width: 100%;
                height: 100%;
                text-align: center;
            }
            #ad-screen{
                height: 100%;
                transform: scale( -1, 1 );
            }
            #ad-camera{
                /* */
            }
        </style>
    </head>
    <body>
        <div id="ad-screen-wrap">
            <img id="ad-screen" src="">
        </div>
        <video id="ad-camera" autoplay loop muted>
            <source src="" >
        </video>
        <canvas id="ad-canvas"></canvas>
    </body>
    <script>

        const RATE = 50;    // in milliseconds

        function r(n){
            return document.getElementById(n)
                || document.getElementsByClassName(n)
                || document.getElementsByTagName(n);
        }
        function isRed( r, g, b ){
            return ( r > 1.5*(g+b)
                && r > 2*g
                && r > 2*b
                && ( r+g+b > 200 )
                && ( r+g+b < 750 ) );
        }
        function isBlue( r, g, b ){
            return ( b > 1.25*(r+g)
                && b > 2*r
                && b > 2*g
                && ( r+g+b > 200 )
                && ( r+g+b < 750 ) );
        }
        function captureImage(){
            CANVAS.width = WIDTH;
            CANVAS.height = HEIGHT;
            CTX.drawImage( CAMERA_VIDEO_STREAM, 0, 0, WIDTH, HEIGHT );
            setCursor();
            // const data = CANVAS_OUT.toDataURL( "image/jpeg" );
            const data = CANVAS.toDataURL( "image/jpeg" );
            SCREEN.src = data;
        }
        function setCursor(){
            const step = 10,
                data = CTX.getImageData( 0, 0, CANVAS.width, CANVAS.height ).data;
            for ( let i=0; i < data.length-4; i+=4 ){
                let r = data[ i ],
                    g = data[ i+1 ],
                    b = data[ i+2 ];
                if ( isRed( r, g, b ) ){
                    let pos = getPosition( i/4 );
                    drawPixel( pos );
                    return;
                }
            }
        }
        function getPosition( n ){
            return {
                x: n % CANVAS.width,
                y: n / CANVAS.width
            };
        }
        function drawPixel( pos ){
            /*CTX_OUT.fillStyle = "#0F0";
            CTX_OUT.beginPath();
            CTX_OUT.rect( pos.x, pos.y, 10, 10 );
            CTX_OUT.fill();*/
            CTX.fillStyle = "#0F0";
            CTX.beginPath();
            CTX.rect( pos.x, pos.y, 10, 10 );
            CTX.fill();
        }

        const SCREEN = r( "ad-screen" ),
            SCREEN_STROKE = r( "ad-screen-stroke" ),
            CANVAS = r( "ad-canvas" ),
            CTX = CANVAS.getContext( "2d" ),
            CANVAS_OUT = document.createElement( "canvas" ),
            CTX_OUT = CANVAS_OUT.getContext( "2d" ),
            CAMERA_VIDEO_STREAM = r( "ad-camera" );

        let WIDTH = window.innerWidth,
            HEIGHT = 0,
            STREAMING = false;

        if (navigator.mediaDevices && navigator.mediaDevices.getUserMedia( { video: true } ) ){
            navigator.mediaDevices
                .getUserMedia( {
                    video: {
                        width: 680,
                        height: 420
                    },
                    frameRate: {
                        ideal: 10,
                        max: 15
                    }
                } )
                .then ( ( stream ) => {
                    CAMERA_VIDEO_STREAM.srcObject = stream;
                    CAMERA_VIDEO_STREAM.play();
            } )
        }

        CAMERA_VIDEO_STREAM.addEventListener( "canplay", ( ev ) => {
            if ( !STREAMING ){
                HEIGHT = CAMERA_VIDEO_STREAM.videoHeight / ( CAMERA_VIDEO_STREAM.videoWidth / WIDTH );
                CANVAS.setAttribute( "width", WIDTH );
                CANVAS.setAttribute( "height", HEIGHT );
                CANVAS_OUT.setAttribute( "width", WIDTH );
                CANVAS_OUT.setAttribute( "height", HEIGHT );
                CAMERA_VIDEO_STREAM.setAttribute( "width", WIDTH );
                CAMERA_VIDEO_STREAM.setAttribute( "height", HEIGHT );
                STREAMING = true;
                setInterval( captureImage, RATE );
            }
        }, false );

    </script>
</html>
