    </head>
    <body>
        <div class="page-wrap has-topbar">
            <div class="topbar">
                &Phi;&Xi;
            </div>
        </div>
    </body>
    <script>
        ( function(){
            function onTripleClick(){
                window.location.href = "/src/js/pimf/q-builder.html";
            }
            let p = U.r("page-wrap")[0],
                t = new Date().getTime(),
                c = 0;
            p.style.height = "80vh";
            p.addEventListener("click",()=>{
                let tt = new Date().getTime();
                if ( tt - t < 600 ){
                    c++;
                } else {
                    c = 0;
                }
                t = tt;
                if ( c == 3 ){
                    c = 0;
                    onTripleClick();
                }
            });
        } )();
    </script>
</html>
