<html>
    <head>
        <meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=0">
        <link rel="icon" type="image/x-icon" href="/icon/phixi.svg">
        <script type="text/javascript" src="https://phi-xi.github.io/src/js/utils.js?1002"></script>
        <link rel="stylesheet" href="https://fonts.googleapis.com/css?family=Ubuntu">
        <link rel="stylesheet" href="https://phi-xi.github.io/src/css/style.css?1009">
        <title>&Phi;Phi:Xi&Xi;</title>
        <style>
            .topbar {
                font-size: 1.5em;
            }
            #cli-wrap {
                width: 90vw;
                margin-bottom: 4rem;
                text-align: center;
            }
            #cli {
                width: 100%;
            }
        </style>
    </head>
    <body>
        <div class="page-wrap has-topbar">
            <div class="topbar">
                &Phi;<span class="orange">Phi:Xi</span>&Xi;
            </div>
            <div id="cli-wrap">
                <input id="cli">
            </div>
            <button class="btn-green" onclick="window.location.href='/letter'">Letter</button>
        </div>
    </body>
    <script>
        
        ( function(){
            function onTripleClick(){
                window.location.href = "/src/js/pimf/q-builder.html";
            }
            let p = U.r("page-wrap")[0],
                t = new Date().getTime(),
                c = 0;
            p.style.height = "80vh";
            p.addEventListener( "keydown", (e)=>{
                if ( e.keyCode == 13 ){
                    let tt = new Date().getTime();
                    if ( tt - t < 600 ){
                        c++;
                    } else {
                        c = 0;
                    }
                    t = tt;
                    if ( c == 3 ){
                        c = 0;
                        onTripleClick();
                    }
                }
            });
            U.r("cli").focus();
        } )();
        
    </script>
</html>
