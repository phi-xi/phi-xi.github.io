        function generate( margin=1 ){
            const resultBox = document.getElementById( "result" );
            let linesExisting = Array(8).fill( "" );
            for ( let i=0; i < txt.value.length; i++ ){
                let c = txt.value[ i ].toUpperCase(),
                    linesNew = char[ c ].split( "\n" );
                for ( let k=0; k < linesExisting.length; k++ ){
                    linesExisting[ k ] += linesNew[ k ];
                }
            }
            resultBox.value = linesExisting.join( "\n" );
        }
        function prepareCharset( charset, margin=1 ){
            for ( let c in charset ){
                if ( c == "width" ) continue;
                charset[ c ] = charset[ c ].slice(1);
                charset[ c ] = addSpaces( charset[ c ], charset.width + margin );
            }
            return charset;
        }
        function addSpaces( c, len ){
            let rows = c.split( "\n" ),
                out = "";
            for ( let i=0; i < rows.length; i++ ){
                let r = rows[ i ];
                while ( r.length < len ){
                    r += " ";
                }
                r += "\n";
                out += r;
            }
            return out;
        }

        txt.addEventListener( "input", generate );

        char = prepareCharset( char, 1 );
        txt.focus();
